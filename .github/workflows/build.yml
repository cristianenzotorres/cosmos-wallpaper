name: Build APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android manifest
        run: |
          mkdir -p app/src/main
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            FOUND=$(find . -name "AndroidManifest.xml" | head -n 1)
            [ -n "$FOUND" ] && cp "$FOUND" app/src/main/AndroidManifest.xml || echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"/>' > app/src/main/AndroidManifest.xml
          fi
      - name: Build debug APK
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
