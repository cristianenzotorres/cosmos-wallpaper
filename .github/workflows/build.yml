name: Compilar APK en la Nube

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar estructura de carpetas Android
        run: |
          if [ -d "aplicación" ] && [ ! -d "app" ]; then
            cp -r "aplicación" "app"
          fi
          if [ -d "app/src/principal" ] && [ ! -d "app/src/main" ]; then
            cp -r "app/src/principal" "app/src/main"
          fi
          if [ -d "app/src/main/activos" ] && [ ! -d "app/src/main/assets" ]; then
            cp -r "app/src/main/activos" "app/src/main/assets"
          fi
          if [ -f "app/src/main/assets/fondo-celular-audioritmico.html" ] && [ ! -f "app/src/main/assets/fondo-celular-audioritmico.html" ]; then
            true
          fi

      - name: Inicializar Gradle y Compilar APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Cosmos-Audioritmico-APK
          path: app/build/outputs/apk/debug/app-debug.apk
