name: Compilar APK en la Nube
​on:
push:
branches: [ main, master, principal ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar código
uses: actions/checkout@v4
​- name: Configurar Java 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
​- name: Preparar estructura de carpetas Android
run: |
if [ -d "aplicación" ] && [ ! -d "app" ]; then
cp -r "aplicación" "app"
fi
if [ -d "app/src/principal" ] && [ ! -d "app/src/main" ]; then
cp -r "app/src/principal" "app/src/main"
fi
if [ -d "app/src/main/activos" ] && [ ! -d "app/src/main/assets" ]; then
cp -r "app/src/main/activos" "app/src/main/assets"
fi
​- name: Inicializar Gradle y Compilar APK
run: |
gradle --no-daemon wrapper --gradle-version 8.5
chmod +x gradlew
./gradlew --no-daemon assembleDebug
​- name: Subir APK listo para descargar
uses: actions/upload-artifact@v4
with:
name: Cosmos-Audioritmico-APK
path: app/build/outputs/apk/debug/app-debug.apk
