name: Compilar APK en la Nube
​on:
push:
branches: [ main, master, principal ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar codigo
uses: actions/checkout@v4
​- name: Configurar Java 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
​- name: Preparar carpetas Android
run: |
mkdir -p app/src/main/assets
if [ -d "aplicación" ]; then cp -r aplicación/* app/ 2>/dev/null || true; fi
if [ -d "app/src/principal" ]; then cp -r app/src/principal/* app/src/main/ 2>/dev/null || true; fi
if [ -d "app/src/main/activos" ]; then cp -r app/src/main/activos/* app/src/main/assets/ 2>/dev/null || true; fi
​- name: Compilar APK
run: |
gradle --no-daemon wrapper --gradle-version 8.5
chmod +x gradlew
./gradlew --no-daemon assembleDebug
​- name: Subir APK
uses: actions/upload-artifact@v4
with:
name: Cosmos-Audioritmico-APK
path: app/build/outputs/apk/debug/app-debug.apk
