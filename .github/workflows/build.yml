name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android assets
        run: |
          mkdir -p app/src/main/assets
          if [ -d "aplicación" ]; then cp -r aplicación/* app/src/main/assets/; fi
          if [ -d "app/src/principal" ]; then cp -r app/src/principal/* app/src/main/assets/; fi
          if [ -d "app/src/main/activos" ]; then cp -r app/src/main/activos/* app/src/main/assets/; fi

      - name: Build debug APK
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.9/bin/gradle --no-daemon wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cosmos-Audioritmico-APK
          path: app/build/outputs/apk/debug/app-debug.apk
